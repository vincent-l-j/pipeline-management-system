databases:
  - engine: PG
    name: db
    production: false
    version: "16"
envs:
  - key: GIT_BRANCH
    scope: BUILD_TIME
    value: develop
ingress:
  rules:
    - component:
        name: backend
        preserve_path_prefix: true
      match:
        path:
          prefix: /api
    - component:
        name: frontend
      match:
        path:
          prefix: /
jobs:
  - dockerfile_path: backend/Dockerfile
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
    github:
      branch: ${GIT_BRANCH}
      deploy_on_push: false
      repo: vincent-l-j/pipeline-management-system
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    kind: PRE_DEPLOY
    name: migrate
    run_command: alembic upgrade head
    source_dir: backend
name: staging
region: syd
services:
  - dockerfile_path: backend/Dockerfile
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: SECRET_KEY
        scope: RUN_TIME
        type: SECRET
        value: EV[1:OAOSO8OR4V5ZO8SK4tFjDWCZcopkDnnx:KZJV6Wt/NMEa03PxQyZDDKnb0FUrUlkhAOjlhLAgy+UcQIoRDTiAPGp4YKHrUDwNBKeXRN5DodG0B9kjxBWZBVpRHp53119SoFPJwiYV6tY=]
      - key: AZURE_CLIENT_ID
        scope: RUN_TIME
        value: 2a94d264-6fd7-4b60-a542-986cf1e9c6da
      - key: AZURE_TENANT_ID
        scope: RUN_TIME
        value: dc0fb419-bc2a-4fc8-8735-f6e20537bf0c
      - key: AZURE_CLIENT_SECRET
        scope: RUN_TIME
        type: SECRET
