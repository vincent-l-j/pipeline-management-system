name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  # A `paths-ignore:` here would skip the workflow, and a required check that
  # never reports leaves the PR pending forever. So the gate is a job-level `if:`.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      run_code_jobs: ${{ steps.filter.outputs.run_code_jobs }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # a shallow clone omits the PR base this diffs against
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Mirrors the deploy workflows' paths-ignore; the two move together.
          skip_paths='(^\.devcontainer/|^docs/|^mission/|^sop/|\.md$)'

          decide() {
            echo "run_code_jobs=$1" >> "$GITHUB_OUTPUT"
            echo "run_code_jobs=$1 ($2)"
            exit 0
          }

          if [ "$EVENT_NAME" != "pull_request" ]; then
            decide true "$EVENT_NAME is not a pull request"
          fi

          changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA") \
            || decide true "could not diff $BASE_SHA...$HEAD_SHA"
          [ -n "$changed" ] || decide true "empty diff"

          code_files=$(printf '%s\n' "$changed" | grep -vE "$skip_paths") || true
          [ -z "$code_files" ] || decide true "$(echo "$code_files" | wc -l) code files"
          decide false "no code changes"

  # Ungated: prettier formats the markdown/json/yaml in $skip_paths, so a diff the
  # code jobs skip is exactly what this job catches.
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      - run: npm run format:prettier:check
      - run: npm run format:ruff:check
        if: always()

  typecheck:
    name: Typecheck (frontend)
    needs: changes
    if: needs.changes.outputs.run_code_jobs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck

  lint-frontend:
    name: Lint (frontend)
    needs: changes
    if: needs.changes.outputs.run_code_jobs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint:frontend

  lint-backend:
    name: Lint (backend)
    needs: changes
    if: needs.changes.outputs.run_code_jobs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      - run: npm run lint:backend

  checks:
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.run_code_jobs == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # `dev`, not `test`: the backend suite needs a Postgres, and a build
          # stage cannot reach a service container. This entry proves the image
          # builds; `backend-tests` below runs the suite.
          - name: Backend image
            service: backend
            target: dev
          - name: Frontend build
            service: frontend
            target: build
          - name: Frontend tests
            service: frontend
            target: test
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: docker build --target ${{ matrix.target }} ./${{ matrix.service }}

  # The backend suite runs against a real Postgres, built by the migrations. It
  # used to run inside `docker build --target test` on in-memory SQLite, which
  # asserted nothing about native enums, VARCHAR limits, TIMESTAMPTZ or foreign
  # keys — see the docstring in backend/tests/conftest.py.
  backend-tests:
    name: Backend tests
    needs: changes
    if: needs.changes.outputs.run_code_jobs == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pms
          POSTGRES_PASSWORD: pms
          # A different database from the migration job's: that suite runs
          # DROP SCHEMA public CASCADE between tests.
          POSTGRES_DB: pms_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
        working-directory: backend
      # tests/migrations is excluded, not merely unconfigured: TEST_DATABASE_URL
      # is unset here so it would skip anyway, but naming the exclusion keeps this
      # job's scope from depending on that.
      - run: pytest --ignore=tests/migrations
        working-directory: backend
        env:
          APP_TEST_DATABASE_URL: postgresql://pms:pms@localhost:5432/pms_app_test

  # Alembic migration tests need their own disposable Postgres, because they wipe
  # the schema between tests. Separate from `backend-tests` so a migration failure
  # and an application failure stay distinguishable.
  migrations:
    name: Migration tests
    needs: changes
    if: needs.changes.outputs.run_code_jobs == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pms
          POSTGRES_PASSWORD: pms
          POSTGRES_DB: pms_migrations_test
        ports:
          - 5432:5432
        # Gate steps until Postgres accepts connections, else the conftest's
        # reachability check can race and silently skip the whole module.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
        working-directory: backend
      # Scoped by path, not by `-m migrations`: the marker is applied module-wide
      # and selects the same tests, so the flag only added a string that silently
      # empties the selection when it is misspelled.
      - run: pytest tests/migrations
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://pms:pms@localhost:5432/pms_migrations_test
