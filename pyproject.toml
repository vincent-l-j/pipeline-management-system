[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "venv", ".pytest_cache", "__pycache__", "backend/alembic/versions"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # Pyflakes
  "I",    # isort
  "N",    # pep8-naming
  "UP",   # pyupgrade
  "C90",  # mccabe complexity
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "PIE",  # flake8-pie
]
ignore = [
  "E501",   # line too long (handled by formatter)
  "W505",   # doc line too long (handled by formatter)
  "B008",   # Do not perform function call in argument defaults; FastAPI idiom requires this
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
