alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
databases:
  - cluster_name: db-pgsql-syd1-51653
    engine: PG
    name: db
    production: true
    version: "16"
domains:
  - domain: ims.rozettainstitute.com
    type: PRIMARY
ingress:
  rules:
    - component:
        name: backend
        preserve_path_prefix: true
      match:
        path:
          prefix: /api
    - component:
        name: frontend
      match:
        path:
          prefix: /
jobs:
  - dockerfile_path: backend/Dockerfile
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
    github:
      branch: main
      deploy_on_push: false
      repo: vincent-l-j/pipeline-management-system
    instance_size_slug: apps-s-1vcpu-0.5gb
    kind: PRE_DEPLOY
    name: migrate
    run_command: alembic upgrade head
    source_dir: backend
name: production
region: syd
services:
  # On a 512 MB instance an OOM kill is the likeliest way this dies, and the
  # liveness probe cannot catch it: /api/health is a static literal, so App
  # Platform only ever restarts this service when the platform itself killed it.
  - alerts:
      - rule: RESTART_COUNT
        value: 3
        operator: GREATER_THAN
        window: TEN_MINUTES
      - rule: MEM_UTILIZATION
        value: 85
        operator: GREATER_THAN
        window: FIVE_MINUTES
    dockerfile_path: backend/Dockerfile
    envs:
      - key: SECRET_KEY
        scope: RUN_TIME
        type: SECRET
        value: EV[1:CF0SRH9MMYNHvE1AAG2gQBWZBpEmYtJg:RTp5PC0JJO73MUlkIM2YLowpFXaKiNR1qUeXxk5jEHPbovf2E8xDNsqswsREbDtfvB8xLEq4xfNX9WBiFjpZTD9VVpeA+fpssboE5EaBX0k=]
      - key: AZURE_CLIENT_ID
        scope: RUN_TIME
        value: 2a94d264-6fd7-4b60-a542-986cf1e9c6da
      - key: AZURE_TENANT_ID
        scope: RUN_TIME
        value: dc0fb419-bc2a-4fc8-8735-f6e20537bf0c
      - key: AZURE_CLIENT_SECRET
        scope: RUN_TIME
        type: SECRET
        value: EV[1:QzMOjY6h74/2NHZ3vGGrpf/eJTO6zOBh:S16NLn7l3KK6tar/kpC+TD0YwS9B+gyPefZhKyFw3hCVIYjtLhT8Yxr6h9hCA4MUkQTbAYUchsU=]
      - key: AZURE_REDIRECT_URI
        scope: RUN_TIME
        value: ${APP_URL}/api/auth/callback
      - key: FRONTEND_URL
        scope: RUN_TIME
        value: ${APP_URL}
      - key: ADMIN_EMAILS
        scope: RUN_TIME
        type: SECRET
        value: EV[1:3KexvBVJqVm7a0J7NJD7wD3H8wfD5bIo:8PtI30horJLdTK6Q3DN+JwrSple4oZ57ndsibOYSAltc10FarIAi2ro5XgBfMNpfvmU9XhmFREDT5uCZ4amOYTD0qUSGbanA2wM8tbUkmfyxPCM33acxvLTbii9u3u1/mXoLculofdeu743zXCpSIN6WWj5NIew=]
      - key: BACKEND_CORS_ORIGINS
        scope: RUN_TIME
        value: ${APP_URL}
      - key: ENABLE_DEV_LOGIN
        scope: RUN_TIME
        value: "false"
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: LOG_LEVEL
        scope: RUN_TIME
        value: INFO
      - key: ENVIRONMENT
        scope: RUN_TIME
        value: production
      - key: APP_VERSION
        scope: RUN_TIME
        value: "0.1.0"
    github:
      branch: main
      deploy_on_push: false
      repo: vincent-l-j/pipeline-management-system
    health_check:
      http_path: /api/health
    http_port: 8000
    instance_size_slug: apps-s-1vcpu-0.5gb
    name: backend
    run_command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    source_dir: backend
static_sites:
  - build_command: npm run build
    catchall_document: index.html
    envs:
      - key: VITE_API_BASE_URL
        scope: BUILD_TIME
        value: /api
    github:
      branch: main
      deploy_on_push: false
      repo: vincent-l-j/pipeline-management-system
    name: frontend
    output_dir: dist
    source_dir: frontend
