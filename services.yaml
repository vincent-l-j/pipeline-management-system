# Commands and services validators/workers use to build, test, and run the system.
# The canonical local stack is Docker Compose (db + backend + frontend, plus minio
# behind the `objectstore` profile). The command keys below also work on a host
# with Python 3.12 + Node installed.

commands:
  # Install backend (incl. test deps), frontend, and the root format toolchain.
  # Only prettier lives in the root package.json; eslint + typescript are frontend
  # devDependencies, and ruff comes from backend/requirements-dev.txt.
  install: npm install && (cd backend && pip install -r requirements-dev.txt) && (cd frontend && npm install)

  # Production build of the SPA (also the frontend "does it compile" check).
  build: cd frontend && npm run build

  # Full test suite: backend pytest + frontend vitest.
  test: (cd backend && pytest) && (cd frontend && npm test)

  # Granular test entry points (used by per-feature verificationSteps).
  test-backend: cd backend && pytest
  test-frontend: cd frontend && npm test

  # Lint: eslint over frontend/ + ruff over backend/. The root scripts delegate,
  # so each linter's config sits with the code it lints —
  # frontend/eslint.config.mjs and [tool.ruff] in backend/pyproject.toml.
  lint: npm run lint
  lint-frontend: npm run lint:frontend
  lint-backend: npm run lint:backend
  # Autofixes the mechanical subset; anything left needs a real edit.
  lint-fix: npm run lint:fix

  # Typecheck: tsc over frontend/ (the backend has no type checker configured).
  # The script bakes in `--force`: `tsc -b` does not replay stored errors for
  # unchanged files, so an incremental run over stale build info can report
  # success while real errors remain. Do not add -- --force here; npm swallows
  # --force as its own flag instead of forwarding it to tsc.
  typecheck: npm run typecheck

  # Format: prettier over the whole repo + ruff format over backend/.
  format: npm run format
  format-check: npm run format:check

services:
  db:
    start: docker compose up -d db
    stop: docker compose stop db
    healthcheck: docker compose exec -T db pg_isready -U rozetta -d rozetta_pms
    port: 5432
    depends_on: []

  backend:
    # `up -d backend` also starts db via compose depends_on.
    start: docker compose up -d backend
    stop: docker compose stop backend
    healthcheck: curl -sf http://localhost:8000/api/health
    port: 8000
    depends_on: [db]

  frontend:
    start: docker compose up -d frontend
    stop: docker compose stop frontend
    healthcheck: curl -sf http://localhost:5173
    port: 5173
    depends_on: [backend]

  # The object store attachments live in. Only needed to exercise them for real
  # (VAL-ATTACH-002) — the unit suites stub the transport and need nothing running.
  # Both services are named explicitly because naming a profiled service is what
  # enables its profile; `up -d minio` alone would skip the bucket initialiser and
  # every upload would fail against a bucket that does not exist.
  minio:
    start: docker compose --profile objectstore up -d minio minio-bucket
    stop: docker compose stop minio
    healthcheck: curl -sf http://localhost:9000/minio/health/live
    # 9000 is the S3 API; the object browser is on 9001.
    port: 9000
    depends_on: []

# Notes:
# - `docker compose up --build` brings up the whole stack at once.
# - The `services:` block above is host-only. Inside the .devcontainer there is no
#   Docker CLI and no socket, and the egress firewall would reject Docker Hub pulls
#   anyway. But you do not need them there: .devcontainer/compose.yaml `include:`s
#   this repo's docker-compose.yml, so all of them — minio included, via
#   `runServices` in devcontainer.json — are already running as siblings of the dev
#   container. Start/stop/rebuild are host-side operations —
#   see .devcontainer/README.md. The `commands:` above all work unchanged in
#   either place.
# - The healthchecks above assume host-published ports. Inside the devcontainer
#   `appnet` is internal, so reach the services by name instead:
#   `curl -sf http://backend:8000/api/health`, `curl -sf http://frontend:5173`,
#   `curl -sf http://minio:9000/minio/health/live`.
# - Swagger/OpenAPI for black-box API probing: http://localhost:8000/docs
# - Local dev forces ENABLE_DEV_LOGIN=true (a Dev Login admin button); this is
#   off in production.
# - `test-backend` needs the `db` service up. The suite runs against a disposable
#   Postgres database (`APP_TEST_DATABASE_URL`, default `pms_app_test` on `db`),
#   whose schema it rebuilds from the migrations on every run. It used to run on
#   in-memory SQLite and need nothing; that could not fail the way Postgres does.
#   `pytest tests/migrations` uses a second, separate database — see
#   backend/tests/migrations/conftest.py.
