[pytest]
# Put the backend root on sys.path so tests can `import app...` when run from here.
pythonpath = .
testpaths = tests
# An undeclared marker is an error, not a warning: a misspelled marker leaves a
# marker-selected job collecting nothing and reporting green.
addopts = --strict-markers
markers =
    migrations: runs real Alembic migrations against a disposable Postgres
        (needs TEST_DATABASE_URL). Skipped otherwise. See tests/migrations/.
