name: staging
region: syd

databases:
  - name: db
    engine: PG
    version: "16"
    production: false

services:
  - name: backend
    source_dir: backend
    dockerfile_path: backend/Dockerfile
    github:
      repo: vincent-l-j/pipeline-management-system
      branch: develop
      deploy_on_push: false
    run_command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    http_port: 8000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    routes:
      - path: /api
        preserve_path_prefix: true   # without this, App Platform strips /api before forwarding
    health_check:
      http_path: /api/health         # matches @app.get("/api/health") in app/main.py. NOTE: this is
                                      # the literal path on the container — health checks bypass the
                                      # /api route mapping, so it must include the /api prefix.
    envs:
      - key: DATABASE_URL
        value: ${db.DATABASE_URL}
        scope: RUN_TIME
      # JWT signing key. config.py reads SECRET_KEY
      - key: SECRET_KEY
        type: SECRET
        scope: RUN_TIME
      - key: AZURE_CLIENT_ID
        scope: RUN_TIME
        value: 2a94d264-6fd7-4b60-a542-986cf1e9c6da
      - key: AZURE_TENANT_ID
        scope: RUN_TIME
        value: dc0fb419-bc2a-4fc8-8735-f6e20537bf0c
      # Required: the backend uses MSAL ConfidentialClientApplication, which
      # needs the client secret to exchange the auth code for a token.
      - key: AZURE_CLIENT_SECRET
        type: SECRET
        scope: RUN_TIME
      # Must EXACTLY match the Redirect URI registered on the Azure app
      # (scheme + host + path). On App Platform the frontend and backend share
      # one origin, so this is your app's public URL + /api/auth/callback.
      # ${APP_URL} is a platform bindable var → your app's live URL (the
      # *.ondigitalocean.app default, or a custom primary domain later). It
      # already includes the https:// scheme, so do NOT prefix it.
      # NOTE: register this exact callback URL in your Azure app registration
      # after the first deploy (you won't know the *.ondigitalocean.app host
      # until then). Bindable vars resolve at RUN_TIME only — fine here.
      - key: AZURE_REDIRECT_URI
        scope: RUN_TIME
        value: ${APP_URL}/api/auth/callback
      # Where the backend redirects the browser (with the JWT) after login.
      # Same-origin deployment → your app's public URL.
      - key: FRONTEND_URL
        scope: RUN_TIME
        value: ${APP_URL}
      # Emails granted ADMIN automatically on first sign-in (comma-separated).
      # PII — kept out of git: set the value as an encrypted var in the DO control
      # panel. Declared type: SECRET so App Platform retains that value across spec
      # applies (a valueless non-secret var would be blanked on the next deploy).
      - key: ADMIN_EMAILS
        type: SECRET
        scope: RUN_TIME
      # Same-origin in prod, but config.py still requires the var; harmless to set.
      - key: BACKEND_CORS_ORIGINS
        scope: RUN_TIME
        value: ${APP_URL}
      # Explicitly OFF for production
      - key: ENABLE_DEV_LOGIN
        value: "false"
        scope: RUN_TIME

# ---------------------------------------------------------------------------
# Frontend: Vite SPA as a static site (buildpack, not the Dockerfile).
# Served from the edge under the same origin as the backend, so /api requests
# are same-origin: no CORS, and the localStorage JWT travels normally.
# ---------------------------------------------------------------------------
static_sites:
  - name: frontend
    source_dir: frontend
    github:
      repo: vincent-l-j/pipeline-management-system
      branch: develop
      deploy_on_push: false
    build_command: npm run build
    output_dir: dist
    catchall_document: index.html   # so React Router deep links (/pitches/42) don't 404
    routes:
      - path: /
    envs:
      # MUST be BUILD_TIME — Vite inlines VITE_* into the bundle at build.
      # Setting it RUN_TIME does nothing.
      - key: VITE_API_BASE_URL
        scope: BUILD_TIME
        value: /api
      # VITE_ENABLE_DEV_LOGIN is deliberately NOT set here. Leaving it absent
      # keeps the "Dev Login (Admin)" button out of production.

jobs:
  - name: migrate
    kind: PRE_DEPLOY
    source_dir: backend
    dockerfile_path: backend/Dockerfile
    github:
      repo: vincent-l-j/pipeline-management-system
      branch: develop
    run_command: alembic upgrade head
    instance_size_slug: apps-s-1vcpu-0.5gb
    envs:
      - key: DATABASE_URL
        value: ${db.DATABASE_URL}
        scope: RUN_TIME
