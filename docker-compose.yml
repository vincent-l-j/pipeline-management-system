# The canonical definition of the app stack, used both by `docker compose up` and
# by .devcontainer/compose.yaml, which `include:`s it verbatim and adds `app` and
# `dns`. There is no second copy of these services — keep it that way.
#
# Nothing here needs the internet at runtime: dependencies are installed at image
# build time, ENABLE_DEV_LOGIN short-circuits the Azure AD flow, and the object
# store is a sibling container rather than a Space. That is what lets the
# devcontainer run this stack with no egress at all.
#
# The `objectstore` profile is opt-in — `docker compose up` brings up the same
# three services it always did.

services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rozetta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_to_a_strong_password}
      POSTGRES_DB: ${POSTGRES_DB:-rozetta_pms}
    # Loopback-only: POSTGRES_PASSWORD defaults to a placeholder, so binding all
    # interfaces opened the database to the whole network. Still published,
    # because running the backend natively and the Alembic migration tests both
    # need it — the latter skip silently when it is unreachable.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # $$ escapes the Compose interpolation, so the shell inside the container
      # expands these from the service's own environment. Writing $POSTGRES_USER
      # would make Compose substitute it here and silently produce `-U ` on a
      # host where the variable happens to be unset.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - appnet

  backend:
    build:
      context: ./backend
      target: dev
    restart: always
    # Loopback-only, and the one that matters most: ENABLE_DEV_LOGIN is forced
    # true below, so binding all interfaces offered anyone on the network a
    # one-click admin session. Use a compose override to test from a device.
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      # Local dev convenience: enable the test login regardless of .env.
      # Production (DigitalOcean App Platform, .do/app.yaml) leaves this off.
      ENABLE_DEV_LOGIN: "true"
    # Waits for the healthcheck rather than merely for the container to exist,
    # so the first `alembic upgrade head` cannot race Postgres's own init.
    depends_on:
      db:
        condition: service_healthy
    # python, not curl: the image is python:3.12-slim and ships no curl, so a
    # curl probe would report unhealthy forever for the wrong reason.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      # uvicorn's first import is slower than the interval above.
      start_period: 20s
    volumes:
      - ./backend:/app
    networks:
      - appnet

  # The object store, for exercising attachments locally. Behind a profile, so
  # `docker compose up` is unchanged for anyone not working on them:
  #
  #   docker compose --profile objectstore up
  #
  # MinIO speaks the same S3 API as Spaces, which is the point — it checks the
  # signature, so a request this app signs wrongly is refused here rather than
  # first discovered against a real Space. The unit suite stubs the transport and
  # cannot catch that: nothing in it verifies a signature.
  #
  # A sibling on appnet, so it needs no internet at runtime and the note at the
  # top of this file still holds. `internal: true` in the devcontainer removes the
  # route out, not the route between these containers.
  minio:
    image: minio/minio
    profiles: ["objectstore"]
    restart: always
    command: server /data --console-address ":9001"
    environment:
      # The app's own credentials are MinIO's root credentials, so there is one
      # pair to set and they cannot drift apart. MinIO wants a password of at
      # least 8 characters.
      MINIO_ROOT_USER: ${SPACES_ACCESS_KEY_ID:-rozettalocal}
      MINIO_ROOT_PASSWORD: ${SPACES_SECRET_ACCESS_KEY:-change_me_to_a_strong_password}
      # Matched to what the backend signs with. A region the store disagrees with
      # is a SignatureDoesNotMatch that says nothing about the region.
      MINIO_SITE_REGION: ${SPACES_REGION:-syd1}
    # Loopback-only, as everything else here is. 9000 is the S3 API, 9001 the web
    # console — which is the object browser, so no editor extension is needed to
    # look at what landed.
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - appnet

  # One-shot: MinIO does not create a bucket on its own, and an upload to a
  # missing bucket fails the same way a misconfigured one does.
  minio-bucket:
    image: minio/mc
    profiles: ["objectstore"]
    restart: "no"
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${SPACES_ACCESS_KEY_ID:-rozettalocal}
      MINIO_ROOT_PASSWORD: ${SPACES_SECRET_ACCESS_KEY:-change_me_to_a_strong_password}
      BUCKET: ${SPACES_BUCKET:-rozetta-pms-local}
    # Polls rather than waiting on the healthcheck, so this still works if the
    # image ever changes what it ships to probe itself with. `$$` keeps Compose
    # from expanding these before the shell sees them.
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          echo "waiting for minio..."
          sleep 1
        done
        mc mb --ignore-existing "local/$$BUCKET"
        # Private, matching the real Space. Already the default; set explicitly so
        # the local bucket cannot quietly differ from the deployed one.
        mc anonymous set none "local/$$BUCKET"
        echo "bucket ready: $$BUCKET"
    networks:
      - appnet

  frontend:
    build:
      context: ./frontend
      target: dev
    restart: always
    # Loopback-only, as above. Vite's own host: "0.0.0.0" governs binding inside
    # the container and is still required.
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      # Shows the "Dev Login (Admin)" button in the local dev UI.
      VITE_ENABLE_DEV_LOGIN: "true"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - appnet

networks:
  # Explicit rather than the implicit `default`, so the devcontainer has a stable
  # name to redeclare as internal:true. A plain bridge here.
  appnet: {}

volumes:
  pgdata:
  miniodata:
