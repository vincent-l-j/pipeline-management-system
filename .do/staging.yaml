      - key: BACKEND_CORS_ORIGINS
        scope: RUN_TIME
        value: ${APP_URL}
      - key: ENABLE_DEV_LOGIN
        scope: RUN_TIME
        value: "false"
    github:
      branch: ${GIT_BRANCH}
      deploy_on_push: false
      repo: vincent-l-j/pipeline-management-system
    health_check:
      http_path: /api/health
    http_port: 8000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    name: backend
    run_command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    source_dir: backend
static_sites:
  - build_command: npm run build
    catchall_document: index.html
    envs:
      - key: VITE_API_BASE_URL
        scope: BUILD_TIME
        value: /api
    github:
      branch: ${GIT_BRANCH}
      deploy_on_push: false
      repo: vincent-l-j/pipeline-management-system
    name: frontend
    output_dir: dist
    source_dir: frontend
