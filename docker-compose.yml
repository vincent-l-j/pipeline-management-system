# The canonical definition of the app stack, used both by `docker compose up` and
# by .devcontainer/compose.yaml, which `include:`s it verbatim and adds `app` and
# `dns`. There is no second copy of these services — keep it that way.
#
# Nothing here needs the internet at runtime: dependencies are installed at image
# build time, ENABLE_DEV_LOGIN short-circuits the Azure AD flow, and the object
# store is a sibling container rather than a Space. That is what lets the
# devcontainer run this stack with no egress at all.

services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rozetta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_to_a_strong_password}
      POSTGRES_DB: ${POSTGRES_DB:-rozetta_pms}
    # Loopback-only: POSTGRES_PASSWORD defaults to a placeholder, so binding all
    # interfaces opened the database to the whole network. Still published,
    # because running the backend natively and the Alembic migration tests both
    # need it — the latter skip silently when it is unreachable.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # $$ escapes the Compose interpolation, so the shell inside the container
      # expands these from the service's own environment. Writing $POSTGRES_USER
      # would make Compose substitute it here and silently produce `-U ` on a
      # host where the variable happens to be unset.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - appnet

  backend:
    build:
      context: ./backend
      target: dev
    restart: always
    # Loopback-only, and the one that matters most: ENABLE_DEV_LOGIN is forced
    # true below, so binding all interfaces offered anyone on the network a
    # one-click admin session. Use a compose override to test from a device.
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      # Local dev convenience: enable the test login regardless of .env.
      # Production (DigitalOcean App Platform, .do/app.yaml) leaves this off.
      ENABLE_DEV_LOGIN: "true"
    # Waits for the healthcheck rather than merely for the container to exist,
    # so the first `alembic upgrade head` cannot race Postgres's own init.
    depends_on:
      db:
        condition: service_healthy
    # python, not curl: the image is python:3.12-slim and ships no curl, so a
    # curl probe would report unhealthy forever for the wrong reason.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      # uvicorn's first import is slower than the interval above.
      start_period: 20s
    volumes:
      - ./backend:/app
    networks:
      - appnet

  # The object store, locally. MinIO checks the signature; the unit suite's stub
  # does not, so a wrongly signed request is refused here rather than in production.
  minio:
    image: cgr.dev/chainguard/minio:latest
    profiles: ["objectstore"]
    restart: always
    command: server /data --console-address ":9001"
    environment:
      # MinIO wants a password of at least 8 characters.
      MINIO_ROOT_USER: ${SPACES_ACCESS_KEY_ID:-rozettalocal}
      MINIO_ROOT_PASSWORD: ${SPACES_SECRET_ACCESS_KEY:-change_me_to_a_strong_password}
      # A region the store disagrees with is a SignatureDoesNotMatch that does
      # not mention the region.
      MINIO_SITE_REGION: ${SPACES_REGION:-syd1}
      # For the healthcheck: defines the `local` alias without needing a
      # writable mc config dir. The readiness endpoint needs no credentials.
      MC_HOST_local: http://localhost:9000
    # 9000 is the S3 API, 9001 the browser console.
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - appnet

  # One-shot: MinIO creates no bucket on its own, so uploads fail with
  # NoSuchBucket until this runs. Distroless: no shell, so no retry loop;
  # waiting is the healthcheck's job.
  minio-bucket:
    image: cgr.dev/chainguard/minio-client:latest
    profiles: ["objectstore"]
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      # Defines the `local` alias inline; replaces `mc alias set`.
      MC_HOST_local: http://${SPACES_ACCESS_KEY_ID:-rozettalocal}:${SPACES_SECRET_ACCESS_KEY:-change_me_to_a_strong_password}@minio:9000
    command:
      - mb
      - --ignore-existing
      - --region
      - ${SPACES_REGION:-syd1}
      - local/${SPACES_BUCKET:-rozetta-pms-local}
    networks:
      - appnet

  # Already the default; explicit so the local bucket cannot quietly differ
  # from the deployed one. Separate service because there is no shell to chain.
  minio-bucket-policy:
    image: cgr.dev/chainguard/minio-client:latest
    profiles: ["objectstore"]
    restart: "no"
    depends_on:
      minio-bucket:
        condition: service_completed_successfully
    environment:
      MC_HOST_local: http://${SPACES_ACCESS_KEY_ID:-rozettalocal}:${SPACES_SECRET_ACCESS_KEY:-change_me_to_a_strong_password}@minio:9000
    command: ["anonymous", "set", "none", "local/${SPACES_BUCKET:-rozetta-pms-local}"]
    networks:
      - appnet

  frontend:
    build:
      context: ./frontend
      target: dev
    restart: always
    # Loopback-only, as above. Vite's own host: "0.0.0.0" governs binding inside
    # the container and is still required.
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      # Shows the "Dev Login (Admin)" button in the local dev UI.
      VITE_ENABLE_DEV_LOGIN: "true"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - appnet

networks:
  # Explicit rather than the implicit `default`, so the devcontainer has a stable
  # name to redeclare as internal:true. A plain bridge here.
  appnet: {}

volumes:
  pgdata:
  miniodata:
